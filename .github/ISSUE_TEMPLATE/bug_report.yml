name: Bug report
description: Something in Igloo does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not report security vulnerabilities here;
        see [SECURITY.md](https://github.com/akkio-inc/Igloo/blob/main/SECURITY.md).
        Remove passwords, keys and other secrets from anything you paste.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps or SQL statements that shows the problem.
      placeholder: |
        CREATE TABLE t (id INTEGER);
        INSERT INTO t VALUES (1);
        SELECT ...;
      render: sql
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Igloo version
      description: Output of `igloo version`, or the image tag you run.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Single machine (Docker Compose)
        - Helm chart
        - OpenTofu module (AWS)
        - OpenTofu module (GCP)
        - OpenTofu module (Azure)
        - Built from source
        - Other
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client
      description: The client or driver and its version, e.g. psql 17, pgx 5.7, a BI tool.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant Igloo log lines (`make logs` on a single machine).
      render: text
