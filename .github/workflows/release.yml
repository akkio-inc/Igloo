name: Release

on:
  push:
    tags: ["v*"]

# Each job asks for only what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/akkio-inc/igloo
  CHART: deploy/helm/igloo
  CHART_REPO: oci://ghcr.io/akkio-inc/charts
  HELM_VERSION: v4.3.0
  COSIGN_VERSION: v3.1.3

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - name: Parse the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Tag $TAG is not of the form vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE"
            exit 1
          fi
          version=${TAG#v}

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          # "latest" goes to the highest stable version, so a patch release
          # for an older minor line does not move it backwards.
          highest=$({ gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name'; echo "$TAG"; } |
            { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's/^v//' | sort -V | tail -n 1)
          latest=false
          if [[ "$prerelease" == false && "$version" == "$highest" ]]; then
            latest=true
          fi

          echo "version=$version prerelease=$prerelease latest=$latest"
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
          } >>"$GITHUB_OUTPUT"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Image (${{ matrix.arch }})
    # Built alongside CI, and pushed by digest only: nothing gets a tag, or
    # is signed, until CI has passed (see publish).
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    # Without a cache, the iceberg extension alone takes up to an hour.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}

      # Release images are built without the CI layer cache so that nothing
      # from an earlier run can end up in a published image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish image
    needs: [prepare, ci, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and attestations
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: 1.2.3 always; 1.2 only for stable versions (metadata-action
      # skips {{major}}.{{minor}} for prereleases); latest only for the
      # highest stable version.
      - name: Image tags and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.latest == 'true' }}

      - name: Push the multi-arch manifest list
        id: push
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do
            args+=(--annotation "$annotation")
          done < <(jq -r '.annotations[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"

      - name: Smoke-test the published image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          out=$(docker run --rm "$IMAGE@$DIGEST" version)
          echo "$out"
          if [[ "$out" != *"$VERSION"* ]]; then
            echo "::error::igloo version printed '$out', expected it to contain $VERSION"
            exit 1
          fi

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records need the artifact-metadata permission; not needed here.
          create-storage-record: false

  chart:
    name: Publish Helm chart
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package
        run: |
          helm dependency build "$CHART"
          helm package "$CHART" --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/chart"

      - name: Push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
          helm push "$RUNNER_TEMP/chart/igloo-$VERSION.tgz" "$CHART_REPO"

  release:
    name: GitHub Release
    needs: [prepare, publish, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      LATEST: ${{ needs.prepare.outputs.latest }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write release notes
        id: notes
        run: |
          notes="$RUNNER_TEMP/notes.md"

          # The CHANGELOG.md section for this version: everything after
          # "## [VERSION]" up to the next "## [" heading or link definitions.
          awk -v version="$VERSION" '
            /^## \[/ { if (found) exit; found = (index($0, "## [" version "]") == 1); next }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' >"$notes"

          # A release's notes hold at most 125,000 characters. A longer section
          # gives its opening paragraphs and a link to the rest.
          if [ "$(wc -c <"$notes")" -gt 120000 ]; then
            awk '/^### /{exit} {print}' "$notes" >"$notes.lead"
            printf 'Every change is listed in [CHANGELOG.md](%s/%s/blob/%s/CHANGELOG.md).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >>"$notes.lead"
            mv "$notes.lead" "$notes"
          fi

          if grep -q '[^[:space:]]' "$notes"; then
            echo "generate=false" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; using generated notes"
            : >"$notes"
            echo "generate=true" >>"$GITHUB_OUTPUT"
          fi

          cat >>"$notes" <<EOF

          ## Install

          Container image (linux/amd64, linux/arm64):

          \`\`\`sh
          docker pull $IMAGE:$VERSION
          # digest: $DIGEST
          \`\`\`

          Helm chart:

          \`\`\`sh
          helm install igloo $CHART_REPO/igloo --version $VERSION
          \`\`\`

          Verify the image signature and build provenance:

          \`\`\`sh
          cosign verify $IMAGE@$DIGEST \\
            --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY
          \`\`\`
          EOF

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATE: ${{ steps.notes.outputs.generate }}
        run: |
          args=(--verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "--latest=$LATEST")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          # With generated notes, GitHub appends them after the notes file.
          if [[ "$GENERATE" == true ]]; then
            args+=(--generate-notes)
          fi
          gh release create "$TAG" "${args[@]}"
