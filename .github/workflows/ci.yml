name: CI

# On pull requests, not on pushes to main: the checks take half an hour. The
# release workflow runs them before publishing anything, and they can be run
# by hand on any branch.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR (a new push cancels the old run); every other commit and
  # every tag gets its own run.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Bump together with deploy/helm and deploy/{aws,gcp,azure} requirements.
  HELM_VERSION: v4.3.0
  TOFU_VERSION: 1.13.1
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

jobs:
  # Igloo's build of DuckDB's Iceberg extension (extensions/iceberg), which
  # the tests and the image use: the Dockerfile's iceberg stage, in a job of
  # its own because built cold it takes most of an hour. Its cache holds it
  # until the build script or the patches change.
  iceberg:
    name: Iceberg extension (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: iceberg-out
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=${{ runner.temp }}/iceberg
          provenance: false
          sbom: false
          cache-from: type=gha,scope=iceberg-${{ matrix.arch }}
          cache-to: type=gha,scope=iceberg-${{ matrix.arch }},mode=max

  go:
    name: Go (${{ matrix.part }})
    needs: iceberg
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # internal/pgwire's tests used a runner's 2 cores for 7 minutes, as
        # long as all the other packages' tests: a third of them run in each
        # of three jobs of their own.
        part: [packages, pgwire 1/3, pgwire 2/3, pgwire 3/3]
    services:
      # The user store tests need a real PostgreSQL.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # DuckDB is linked through cgo; the runner's gcc builds it.
      CGO_ENABLED: "1"
      IGLOO_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: matrix.part == 'packages'
        # third_party keeps its upstream formatting.
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi

      # duckdb_arrow builds DuckDB's Arrow results, for Arrow Flight SQL.
      - name: Vet
        if: matrix.part == 'packages'
        run: go vet -tags duckdb_arrow ./...

      # Igloo's own rb extension, against the bindings' DuckDB: the engine
      # tests require it in CI (extensions/rb/build.sh, a minute).
      - name: Build the rb extension
        run: |
          extensions/rb/build.sh "$RUNNER_TEMP/rb"
          echo "IGLOO_TEST_RB_EXTENSION=$RUNNER_TEMP/rb/rb.duckdb_extension" >>"$GITHUB_ENV"

      # The iceberg extension the iceberg job built, from its cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Fetch the iceberg extension
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: iceberg-out
          outputs: type=local,dest=${{ runner.temp }}/iceberg
          provenance: false
          sbom: false
          cache-from: type=gha,scope=iceberg-amd64

      - name: Use the iceberg extension
        run: echo "IGLOO_TEST_ICEBERG_EXTENSION=$RUNNER_TEMP/iceberg/iceberg.duckdb_extension" >>"$GITHUB_ENV"

      # The spatial and sketch tests load the extensions the image ships.
      - name: Install DuckDB extensions
        run: |
          go run -tags duckdb_arrow ./cmd/igloo install-extensions "$RUNNER_TEMP/duckdb-extensions"
          echo "IGLOO_TEST_EXTENSION_DIR=$RUNNER_TEMP/duckdb-extensions" >>"$GITHUB_ENV"

      - name: Test
        if: matrix.part == 'packages'
        run: |
          mapfile -t packages < <(go list -tags duckdb_arrow ./... | grep -v '/internal/pgwire$')
          # internal/distributed alone takes over 10 minutes on these runners,
          # go test's default limit for a package.
          go test -tags duckdb_arrow -timeout 25m "${packages[@]}"

      - name: Test internal/pgwire
        if: matrix.part != 'packages'
        # pgwire i/n runs every nth test, from the ith, in the order -list
        # gives them; the last runs all those the others do not, so that
        # between them they run every test. -parallel 4, twice these runners'
        # 2 cores: many of the tests spend their time waiting on timers or on
        # other sessions.
        env:
          PART: ${{ matrix.part }}
        run: |
          shard=${PART#pgwire }
          i=${shard%/*} n=${shard#*/}
          tests=$(go test -tags duckdb_arrow -list '^Test' ./internal/pgwire/ | grep '^Test')
          if [ "$i" -lt "$n" ]; then
            select=(-run "^($(awk -v i="$i" -v n="$n" 'NR % n == i' <<<"$tests" | paste -sd '|' -))\$")
          else
            select=(-skip "^($(awk -v n="$n" 'NR % n != 0' <<<"$tests" | paste -sd '|' -))\$")
          fi
          go test -tags duckdb_arrow -timeout 25m -parallel 4 "${select[@]}" ./internal/pgwire/

  migrate:
    name: Migration report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # python -m migrate's unit tests, on synthetic fixtures: no warehouse
      # and no Igloo.
      - name: Test the migration report
        run: make migrate-test

      # bench/run.py's and bench/report.py's unit tests, on a fake Igloo
      # and synthetic results: no platform to run against.
      - name: Test the benchmark's scripts
        run: make bench-test

  image:
    name: Image (${{ matrix.arch }})
    needs: iceberg
    # Each architecture builds on its own native runner: cross-compiling cgo
    # and DuckDB under QEMU is slow and fragile.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ env.VERSION }}
          tags: igloo:ci
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=image-${{ matrix.arch }}
            type=gha,scope=iceberg-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: Check that the binary reports its version
        run: |
          out=$(docker run --rm igloo:ci version)
          echo "$out"
          if [[ "$out" != *"$VERSION"* ]]; then
            echo "::error::igloo version printed '$out', expected it to contain $VERSION"
            exit 1
          fi

      # In the runtime image, not only the build stage: its libraries, and
      # the file the binary's hash names.
      - name: Check that the binary loads its own extensions
        run: docker run --rm igloo:ci check-extensions

      # The end-to-end jobs test this image instead of building their own,
      # which takes an hour without this job's cache.
      - name: Save the image for the end-to-end jobs
        if: matrix.arch == 'amd64'
        run: docker save igloo:ci | gzip -1 >"$RUNNER_TEMP/igloo-ci.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'amd64'
        with:
          name: igloo-ci-image
          path: ${{ runner.temp }}/igloo-ci.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  e2e:
    name: End-to-end
    needs: [go, image]
    runs-on: ubuntu-latest
    # Includes dbt and the notebook libraries, a few minutes of installs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: igloo-ci-image
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/igloo-ci.tar.gz"

      # scripts/e2e.sh prints Igloo's logs itself when a check fails.
      - name: Run the end-to-end tests against the Docker Compose stack
        env:
          E2E_IMAGE: igloo:ci
        run: make e2e

  e2e-distributed:
    name: End-to-end (distributed execution)
    needs: [go, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: igloo-ci-image
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/igloo-ci.tar.gz"

      # The stack with three worker containers; TPC-H with and without
      # workers, grants, a worker killed mid-statement, timeouts.
      - name: Run the distributed execution end-to-end tests
        env:
          E2E_IMAGE: igloo:ci
        run: make e2e-distributed

  helm-e2e:
    name: Helm chart on kind
    needs: [helm, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: igloo-ci-image
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/igloo-ci.tar.gz"

      # Installs the chart on a throwaway kind cluster in bundled mode and
      # checks it end to end; see the script's header.
      - name: Run the Helm end-to-end test
        env:
          SKIP_BUILD: 1
          IMAGE: igloo:ci
        run: make helm-e2e

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHART: deploy/helm/igloo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build chart dependencies
        run: helm dependency build "$CHART"

      - name: Lint with default values
        run: helm lint "$CHART"

      - name: Lint with bundled PostgreSQL and object storage
        run: helm lint "$CHART" --set postgresql.enabled=true --set objectStorage.enabled=true

      - name: Render with default values
        run: helm template igloo "$CHART" >/dev/null

      - name: Render with bundled PostgreSQL and object storage
        run: helm template igloo "$CHART" --set postgresql.enabled=true --set objectStorage.enabled=true >/dev/null

      - name: Lint and render with scale to zero
        run: |
          helm lint "$CHART" --set scaleToZero.enabled=true
          helm lint "$CHART" --set postgresql.enabled=true --set objectStorage.enabled=true \
            --set scaleToZero.enabled=true --set autoscaling.enabled=true
          helm template igloo "$CHART" --set postgresql.enabled=true --set objectStorage.enabled=true \
            --set scaleToZero.enabled=true --set autoscaling.enabled=true \
            --set 'networkPolicy.metricsFrom[0].namespaceSelector.matchLabels.name=monitoring' >/dev/null

      - name: Lint and render with distributed execution
        run: |
          helm lint "$CHART" --set postgresql.enabled=true --set objectStorage.enabled=true --set workers.enabled=true
          helm template igloo "$CHART" --set postgresql.enabled=true --set objectStorage.enabled=true \
            --set workers.enabled=true --set scaleToZero.enabled=true >/dev/null

      - name: Refuse invalid scale-to-zero settings
        run: |
          for invalid in replicaCount=0 autoscaling.enabled=true,scaleToZero.replicas=11; do
            if out=$(helm template igloo "$CHART" --set postgresql.enabled=true --set objectStorage.enabled=true \
              --set scaleToZero.enabled=true --set "$invalid" 2>&1); then
              echo "::error::scaleToZero.enabled with $invalid rendered"
              exit 1
            fi
            if ! grep -q scaleToZero <<<"$out"; then
              echo "::error::unexpected error for $invalid: $out"
              exit 1
            fi
          done

      - name: Lint without the Iceberg REST catalog, and refuse bad STS roles
        run: |
          helm lint "$CHART" --set postgresql.enabled=true --set objectStorage.enabled=true --set iceberg.enabled=false
          if helm template igloo "$CHART" --set storage.s3.stsRoleArn=not-a-role >/dev/null 2>&1; then
            echo "::error::an invalid storage.s3.stsRoleArn rendered"
            exit 1
          fi

      - name: Lint and test compute pools
        run: |
          helm lint "$CHART" -f deploy/helm/test-values/pools.yaml
          deploy/helm/template-test.sh

      # The release workflow packages the chart this way; catch problems early.
      - name: Package
        run: helm package "$CHART" --version 0.0.0-ci --app-version 0.0.0-ci --destination "$RUNNER_TEMP/chart"

  tofu:
    name: OpenTofu (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [aws, gcp, azure]
    defaults:
      run:
        working-directory: deploy/${{ matrix.module }}
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive -diff

      - name: Init
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

      - name: Test
        run: tofu test

  site:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Copies the repository's markdown into the site, builds it with Astro
      # and Starlight in the Makefile's pinned Node image, and checks every
      # link, anchor and image, and that the pages are not indexable yet.
      - name: Build the website and check its links
        run: make site

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell scripts
        run: |
          git ls-files -z -- '*.sh' |
            xargs -0 --no-run-if-empty docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
