# Bundled mode for deploy/helm/e2e.sh on a kind cluster: PostgreSQL and RustFS
# in the release, the locally built igloo:dev image, small resources.
replicaCount: 2
image:
  repository: igloo
  tag: dev
  pullPolicy: Never
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { memory: 2Gi }
duckdb:
  spillVolume:
    sizeLimit: 2Gi
catalog:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
postgresql:
  enabled: true
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
objectStorage:
  enabled: true
  persistence:
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }
# Small workers, with a volume that leaves room for exchanges on the node's disk, and
# that stop soon.
workers:
  maxReplicas: 2
  idleAfter: 30s
  startTimeout: 5m
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }
  duckdb:
    spillVolume:
      sizeLimit: 8Gi
  cacheVolume:
    sizeLimit: 2Gi
# Statements run with and without workers are compared, so each must run.
extraEnv:
  - name: IGLOO_RESULT_CACHE_SIZE
    value: "0"
