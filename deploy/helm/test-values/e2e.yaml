# Bundled mode for deploy/helm/e2e.sh on a kind cluster: PostgreSQL and RustFS
# in the release, the locally built igloo:dev image, small resources.
replicaCount: 2
image:
  repository: igloo
  tag: dev
  pullPolicy: Never
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { memory: 1Gi }
duckdb:
  spillVolume:
    sizeLimit: 2Gi
catalog:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
postgresql:
  enabled: true
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
objectStorage:
  enabled: true
  persistence:
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }
