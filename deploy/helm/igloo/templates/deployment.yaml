{{- /* The igloo Deployment, for the release and for each compute pool (see
_pools.tpl and pools.yaml). */ -}}
{{- define "igloo.serverDeployment" -}}
{{- $secretName := include "igloo.secretName" . -}}
{{- $metadataDb := include "igloo.metadataDatabaseRef" . | fromYaml -}}
{{- $memoryLimit := include "igloo.duckdbMemoryLimit" . -}}
{{- $objectStorage := include "igloo.objectStorageName" . -}}
{{- $component := include "igloo.serverComponent" . -}}
{{- include "igloo.validateCacheVolume" . -}}
{{- $cache := .Values.cacheVolume -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "igloo.serverName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  {{- /* The HorizontalPodAutoscaler or the scale-to-zero gateway owns the
  replica count; setting it here would undo their work on every upgrade. */}}
  {{- if not (or .Values.autoscaling.enabled .Values.scaleToZero.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- if eq (toString .type) "Recreate" }}
    {{- /* Kubernetes refuses rollingUpdate beside Recreate, and values
    merged over the chart's defaults keep it. */}}
    type: Recreate
    {{- else }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "igloo.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "igloo.podLabels" (dict "root" . "component" $component) | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Restart pods when generated or inline secrets change.
        checksum/secret: {{ include "igloo.secretData" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "igloo.serviceAccountName" . }}
      # Cloud identity webhooks (IRSA, Azure workload identity) mount their own
      # tokens. igloo talks to the Kubernetes API only to start and stop
      # distributed-execution workers (workers.yaml).
      automountServiceAccountToken: {{ .Values.workers.enabled }}
      # Service links would put IGLOO_* variables into the environment for
      # Services named igloo-*.
      enableServiceLinks: false
      {{- include "igloo.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.objectStorage.enabled }}
      initContainers:
        # Igloo creates the warehouse on start, and the catalog checks that the
        # bucket exists, so the bucket is created first.
        - name: create-bucket
          image: {{ .Values.objectStorage.initImage }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              url="http://${S3_ENDPOINT}/${S3_BUCKET}"
              sigv4="aws:amz:${S3_REGION}:s3"
              keys="${S3_ACCESS_KEY_ID}:${S3_SECRET_ACCESS_KEY}"
              tries=0
              until curl -q -fsS -o /dev/null --max-time 5 "http://${S3_ENDPOINT}/health"; do
                tries=$((tries + 1))
                if [ "$tries" -ge 90 ]; then
                  echo "object storage at ${S3_ENDPOINT} did not answer" >&2
                  exit 1
                fi
                echo "waiting for object storage at ${S3_ENDPOINT}"
                sleep 2
              done
              exists() {
                curl -q -fs -o /dev/null --max-time 10 -I --aws-sigv4 "$sigv4" --user "$keys" "$url"
              }
              if exists; then
                echo "bucket ${S3_BUCKET} exists"
              elif curl -q -fsS -o /dev/null --max-time 10 -X PUT --aws-sigv4 "$sigv4" --user "$keys" "$url"; then
                echo "created bucket ${S3_BUCKET}"
              elif exists; then
                echo "bucket ${S3_BUCKET} exists (created by another pod)"
              else
                echo "could not create bucket ${S3_BUCKET}" >&2
                exit 1
              fi
          env:
            - name: S3_ENDPOINT
              value: {{ printf "%s:9000" $objectStorage | quote }}
            - name: S3_BUCKET
              value: {{ .Values.objectStorage.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.storage.s3.region | quote }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: object-storage-access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: object-storage-secret-access-key
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      {{- end }}
      containers:
        - name: igloo
          image: {{ include "igloo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: sql
              containerPort: 5432
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.console.enabled }}
            - name: console
              containerPort: 8443
              protocol: TCP
            {{- end }}
            {{- if .Values.flightSQL.enabled }}
            - name: flight-sql
              containerPort: 31337
              protocol: TCP
            {{- end }}
            {{- if .Values.iceberg.enabled }}
            - name: iceberg
              containerPort: 8181
              protocol: TCP
            {{- end }}
          env:
            - name: IGLOO_CONSOLE_ADDR
              value: {{ ternary ":8443" "" .Values.console.enabled | quote }}
            - name: IGLOO_FLIGHT_ADDR
              value: {{ ternary ":31337" "" .Values.flightSQL.enabled | quote }}
            - name: IGLOO_ICEBERG_ADDR
              value: {{ ternary ":8181" "" .Values.iceberg.enabled | quote }}
            - name: IGLOO_ADMIN_USER
              value: {{ .Values.admin.user | quote }}
            - name: IGLOO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.admin.existingSecret }}
                  name: {{ .Values.admin.existingSecret }}
                  key: password
                  {{- else }}
                  name: {{ $secretName }}
                  key: admin-password
                  {{- end }}
            - name: IGLOO_ERASURE_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.erasure.existingSecret }}
                  name: {{ .Values.erasure.existingSecret }}
                  key: key
                  {{- else }}
                  name: {{ $secretName }}
                  key: erasure-key
                  {{- end }}
            {{- with $metadataDb }}
            - name: IGLOO_METADATA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            - name: IGLOO_CATALOG_URI
              value: {{ printf "http://%s:8181/catalog" (include "igloo.catalogName" .) | quote }}
            - name: IGLOO_CATALOG_WAREHOUSE
              value: {{ .Values.catalog.warehouse | quote }}
            - name: IGLOO_WAREHOUSE_LOCATION
              value: {{ include "igloo.warehouseLocation" . | quote }}
            {{- with .Values.storage.allowedLocations }}
            - name: IGLOO_ALLOWED_LOCATIONS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.objectStorage.enabled }}
            - name: IGLOO_S3_ENDPOINT
              value: {{ printf "%s:9000" $objectStorage | quote }}
            - name: IGLOO_S3_REGION
              value: {{ .Values.storage.s3.region | quote }}
            - name: IGLOO_S3_URL_STYLE
              value: path
            - name: IGLOO_S3_USE_SSL
              value: "false"
            - name: IGLOO_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: object-storage-access-key-id
            - name: IGLOO_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: object-storage-secret-access-key
            {{- else }}
            {{- with .Values.storage.s3.endpoint }}
            - name: IGLOO_S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: IGLOO_S3_REGION
              value: {{ .Values.storage.s3.region | quote }}
            - name: IGLOO_S3_URL_STYLE
              value: {{ .Values.storage.s3.urlStyle | quote }}
            - name: IGLOO_S3_USE_SSL
              value: {{ .Values.storage.s3.useSSL | quote }}
            {{- with .Values.storage.s3.existingSecret }}
            - name: IGLOO_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: access-key-id
            - name: IGLOO_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: secret-access-key
            {{- end }}
            {{- with .Values.storage.s3.stsRoleArn }}
            - name: IGLOO_S3_STS_ROLE_ARN
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.storage.gcs.existingSecret }}
            - name: IGLOO_GCS_HMAC_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: hmac-key-id
            - name: IGLOO_GCS_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: hmac-secret
            {{- end }}
            {{- with .Values.storage.azure.existingSecret }}
            - name: IGLOO_AZURE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: account-key
            {{- end }}
            {{- with $memoryLimit }}
            - name: IGLOO_DUCKDB_MEMORY_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with include "igloo.duckdbMaxTempSize" . }}
            - name: IGLOO_DUCKDB_MAX_TEMP_SIZE
              value: {{ . | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.duckdb.threads) }}
            - name: IGLOO_DUCKDB_THREADS
              value: {{ int .Values.duckdb.threads | quote }}
            {{- end }}
            {{- with $cache.sizeLimit }}
            - name: IGLOO_CACHE_SIZE
              value: {{ printf "%dMiB" (int64 (floor (mulf (float64 (include "igloo.quantityMiB" (list "cacheVolume.sizeLimit" .))) 0.9))) | quote }}
            {{- end }}
            # The cache's volume goes with the pod, but for a claim: erasure
            # requests count a pod that is gone as holding nothing.
            - name: IGLOO_CACHE_EPHEMERAL
              value: {{ ne $cache.type "persistentVolumeClaim" | quote }}
            # An ephemeral volume or a claim is the cache's own, which it may
            # fill to IGLOO_CACHE_SIZE; on an emptyDir it shares the node's
            # disk, and takes at most half of its free space.
            - name: IGLOO_CACHE_DEDICATED
              value: {{ ne $cache.type "emptyDir" | quote }}
            {{- if .Values.tls.existingSecret }}
            - name: IGLOO_TLS_CERT_FILE
              value: /etc/igloo/tls/tls.crt
            - name: IGLOO_TLS_KEY_FILE
              value: /etc/igloo/tls/tls.key
            {{- end }}
            - name: IGLOO_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            - name: IGLOO_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            {{- with .Values.statementTimeout }}
            - name: IGLOO_STATEMENT_TIMEOUT
              value: {{ . | quote }}
            {{- end }}
            - name: IGLOO_MAX_CONNECTIONS
              value: {{ int .Values.maxConnections | quote }}
            {{- with .Values.shutdownDelay }}
            - name: IGLOO_SHUTDOWN_DELAY
              value: {{ . | quote }}
            {{- end }}
            - name: IGLOO_MAINTENANCE
              value: {{ .Values.maintenance.enabled | quote }}
            - name: IGLOO_SNAPSHOT_RETENTION
              value: {{ .Values.maintenance.snapshotRetention | quote }}
            - name: IGLOO_TOKEN_MAX_LIFETIME
              value: {{ .Values.tokenMaxLifetime | quote }}
            {{- with .Values.sso }}
            {{- if .issuer }}
            - name: IGLOO_OIDC_ISSUER
              value: {{ .issuer | quote }}
            - name: IGLOO_OIDC_CLIENT_ID
              value: {{ .clientId | quote }}
            {{- if .existingSecret }}
            - name: IGLOO_OIDC_CLIENT_SECRET_FILE
              value: /etc/igloo/oidc/client-secret
            {{- end }}
            {{- with .redirectUrl }}
            - name: IGLOO_OIDC_REDIRECT_URL
              value: {{ . | quote }}
            {{- end }}
            - name: IGLOO_OIDC_SCOPES
              value: {{ join " " .scopes | quote }}
            - name: IGLOO_OIDC_USERNAME_CLAIM
              value: {{ .usernameClaim | quote }}
            - name: IGLOO_OIDC_GROUPS_CLAIM
              value: {{ .groupsClaim | quote }}
            {{- with .allowedDomains }}
            - name: IGLOO_OIDC_ALLOWED_DOMAINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .allowedGroups }}
            - name: IGLOO_OIDC_ALLOWED_GROUPS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: IGLOO_OIDC_CREATE_USERS
              value: {{ .createUsers | quote }}
            - name: IGLOO_OIDC_PASSWORD_SIGNIN
              value: {{ .passwordSignIn | quote }}
            - name: IGLOO_OIDC_DISPLAY_NAME
              value: {{ .displayName | quote }}
            {{- with .accessTokenAudience }}
            - name: IGLOO_OIDC_ACCESS_TOKEN_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .accessTokenIdClaim }}
            - name: IGLOO_OIDC_ACCESS_TOKEN_ID_CLAIM
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with (get . "Pool") }}
            - name: IGLOO_POOL
              value: {{ .name | quote }}
            {{- end }}
            {{- with .Values.pricePerHour }}
            - name: IGLOO_PRICE_PER_HOUR
              value: {{ . | toString | quote }}
            {{- end }}
            {{- if .Values.workers.enabled }}
            {{- include "igloo.coordinatorEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # DuckDB spill files (IGLOO_DUCKDB_TEMP_DIR in the image).
            - name: spill
              mountPath: /var/lib/igloo/tmp
            # The read cache (IGLOO_CACHE_DIR in the image), which prefetch
            # reads ahead into.
            - name: cache
              mountPath: /var/lib/igloo/cache
            # The read cache's extension needs a writable /tmp.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.existingSecret }}
            - name: tls
              mountPath: /etc/igloo/tls
              readOnly: true
            {{- end }}
            {{- if and .Values.sso.issuer .Values.sso.existingSecret }}
            - name: oidc
              mountPath: /etc/igloo/oidc
              readOnly: true
            {{- end }}
      volumes:
        - name: spill
          emptyDir:
            {{- with .Values.duckdb.spillVolume.medium }}
            medium: {{ . }}
            {{- end }}
            {{- with .Values.duckdb.spillVolume.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        - name: cache
          {{- if eq $cache.type "ephemeral" }}
          # A volume of the pod's own, made and deleted with it.
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  {{- include "igloo.podLabels" (dict "root" . "component" $component) | nindent 18 }}
              spec:
                accessModes: ["ReadWriteOnce"]
                {{- with $cache.storageClass }}
                storageClassName: {{ . }}
                {{- end }}
                resources:
                  requests:
                    storage: {{ $cache.sizeLimit }}
          {{- else if eq $cache.type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ $cache.existingClaim }}
          {{- else }}
          emptyDir:
            {{- with $cache.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if and .Values.sso.issuer .Values.sso.existingSecret }}
        # Only the client secret, as a file, so it is not in the process's
        # environment.
        - name: oidc
          secret:
            secretName: {{ .Values.sso.existingSecret }}
            defaultMode: 0440
            items:
              - key: client-secret
                path: client-secret
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        # Prefer one igloo pod per node, so losing a node loses one replica.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "igloo.selectorLabels" (dict "root" . "component" $component) | nindent 20 }}
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
{{- include "igloo.serverDeployment" . }}
