{{- /*
Distributed-execution workers (docs/distributed-execution.md). Igloo pods
scale this Deployment up when a statement needs workers and back to zero
once the workers have been idle for workers.idleAfter; the chart leaves its
replica count to them after the first install. Each compute pool gets
workers of its own (pools.yaml renders this for it too), which only its
igloo pods reach and start, so one client's distributed statements never
take another pool's workers.
*/ -}}
{{- define "igloo.workers" -}}
{{- $name := include "igloo.workersName" . -}}
{{- $memoryLimit := include "igloo.workerMemoryLimit" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 4 }}
spec:
  {{- /* Start with none; later upgrades keep whatever Igloo scaled it to. */}}
  {{- if not (lookup "apps/v1" "Deployment" .Release.Namespace $name) }}
  replicas: 0
  {{- end }}
  selector:
    matchLabels:
      {{- include "igloo.selectorLabels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "igloo.podLabels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 8 }}
        {{- with .Values.workers.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include "igloo.secretData" . | sha256sum }}
        {{- with .Values.workers.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The igloo pods' account: workers read the same object storage, with
      # the same cloud identity. They never call the Kubernetes API, so they
      # get no token for the scaling permission igloo pods have.
      serviceAccountName: {{ include "igloo.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- include "igloo.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # A stopping worker takes no more tasks and finishes those it runs for
      # up to 30s; what it has not finished then fails over to other workers.
      terminationGracePeriodSeconds: {{ .Values.workers.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "igloo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          ports:
            - name: worker
              containerPort: {{ include "igloo.workerPort" . }}
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: IGLOO_WORKER_SECRET
              valueFrom:
                secretKeyRef:
                  {{- include "igloo.workerSecretRef" . | nindent 18 }}
            {{- include "igloo.workerStorageEnv" . | nindent 12 }}
            {{- with $memoryLimit }}
            - name: IGLOO_DUCKDB_MEMORY_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.workers.duckdb.spillVolume.sizeLimit }}
            {{- $spillMiB := float64 (include "igloo.quantityMiB" (list "workers.duckdb.spillVolume.sizeLimit" .Values.workers.duckdb.spillVolume.sizeLimit)) }}
            {{- if eq (.Values.workers.exchanges | default "object") "local" }}
            {{- /* Exchanges share the volume: 60% for spill, 30% for them. */}}
            - name: IGLOO_DUCKDB_MAX_TEMP_SIZE
              value: {{ printf "%dMiB" (int64 (floor (mulf $spillMiB 0.6))) | quote }}
            - name: IGLOO_EXCHANGE_MAX_SIZE
              value: {{ printf "%dMiB" (int64 (floor (mulf $spillMiB 0.3))) | quote }}
            {{- else }}
            - name: IGLOO_DUCKDB_MAX_TEMP_SIZE
              value: {{ printf "%dMiB" (int64 (floor (mulf $spillMiB 0.9))) | quote }}
            {{- end }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.workers.duckdb.threads) }}
            - name: IGLOO_DUCKDB_THREADS
              value: {{ int .Values.workers.duckdb.threads | quote }}
            {{- end }}
            {{- with .Values.workers.cacheVolume.sizeLimit }}
            # The read cache's own volume: copies of the data files this
            # worker read, so repeated statements read local disk.
            - name: IGLOO_CACHE_SIZE
              value: {{ printf "%dMiB" (int64 (floor (mulf (float64 (include "igloo.quantityMiB" (list "workers.cacheVolume.sizeLimit" .))) 0.9))) | quote }}
            {{- end }}
            - name: IGLOO_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            - name: IGLOO_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.workers.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: spill
              mountPath: /var/lib/igloo/tmp
            - name: cache
              mountPath: /var/lib/igloo/cache
            # The read cache's extension needs a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: spill
          emptyDir:
            {{- with .Values.workers.duckdb.spillVolume.medium }}
            medium: {{ . }}
            {{- end }}
            {{- with .Values.workers.duckdb.spillVolume.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        - name: cache
          emptyDir:
            {{- with .Values.workers.cacheVolume.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.workers.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workers.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.workers.affinity }}
        {{- toYaml .Values.workers.affinity | nindent 8 }}
        {{- else }}
        # One worker per node: a statement is divided among machines.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "igloo.selectorLabels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 20 }}
        {{- end }}
---
# The workers' addresses (IGLOO_WORKERS): ready workers only.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "igloo.selectorLabels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 4 }}
  ports:
    - name: worker
      port: {{ include "igloo.workerPort" . }}
      targetPort: worker
      protocol: TCP
---
# Worker metrics (igloo_worker_*, igloo_cache_*). Labelled like the igloo
# metrics Service, so the ServiceMonitor scrapes it too.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "igloo.poolComponentName" (list . "workers-metrics") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "metrics") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "igloo.selectorLabels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# Igloo pods may read and change the workers' replica count, and nothing
# else. (Every pool's pods use the release's service account, so a pool's
# pods could resize another pool's workers, but not reach them.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "igloo.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.networkPolicy.enabled }}
---
# Workers take tasks from their own igloo pods only (those of their compute
# pool), and serve health checks and metrics; with workers.exchanges local,
# they also send each other the rows they exchange, over the same port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "igloo.selectorLabels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "igloo.selectorLabels" (dict "root" . "component" (include "igloo.serverComponent" .)) | nindent 14 }}
      ports:
        - port: worker
          protocol: TCP
    {{- if eq (.Values.workers.exchanges | default "object") "local" }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "igloo.selectorLabels" (dict "root" . "component" (include "igloo.workerComponent" .)) | nindent 14 }}
      ports:
        - port: worker
          protocol: TCP
    {{- end }}
    # Health checks and metrics: from networkPolicy.metricsFrom, or, without
    # it, from pods of this namespace only (kubelet probes are not pod
    # traffic).
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- with .Values.networkPolicy.metricsFrom }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
{{- end }}
{{- end -}}

{{- if .Values.workers.enabled }}
{{ include "igloo.workers" . }}
{{- end }}
