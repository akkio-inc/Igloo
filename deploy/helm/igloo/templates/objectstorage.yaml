{{- /*
Bundled S3-compatible object store (RustFS) for development and on-prem.
Single node, single volume: not redundant. Use cloud object storage in
production.
*/ -}}
{{- if .Values.objectStorage.enabled }}
{{- $name := include "igloo.objectStorageName" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "object-storage") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "igloo.selectorLabels" (dict "root" . "component" "object-storage") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "igloo.podLabels" (dict "root" . "component" "object-storage") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- include "igloo.imagePullSecrets" . | nindent 6 }}
      securityContext:
        # The image's "rustfs" user.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: {{ .Values.objectStorage.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "igloo.secretName" . }}
                  key: object-storage-access-key-id
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "igloo.secretName" . }}
                  key: object-storage-secret-access-key
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            # Log to stdout rather than files under /logs.
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.objectStorage.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "igloo.selectorLabels" (dict "root" . "component" "object-storage") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.objectStorage.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.objectStorage.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "object-storage") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "igloo.selectorLabels" (dict "root" . "component" "object-storage") | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      protocol: TCP
{{- end }}
