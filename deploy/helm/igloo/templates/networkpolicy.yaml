{{- /*
Ingress rules only. Egress stays open: pods need DNS, PostgreSQL, object
storage and cloud identity endpoints, which differ per cloud.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $server := include "igloo.selectorLabels" (dict "root" . "component" "server") -}}
{{- $catalog := include "igloo.selectorLabels" (dict "root" . "component" "catalog") -}}
{{- $gateway := include "igloo.selectorLabels" (dict "root" . "component" "gateway") -}}
# Lakekeeper has no authentication: only igloo pods may call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "igloo.catalogName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "catalog") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $catalog | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $server | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
---
# Igloo pods: the SQL, console, Flight SQL and Iceberg REST ports and the
# health/metrics port, nothing else; the console, Flight SQL and the Iceberg
# REST catalog are open to whoever may reach SQL. With scale to zero, clients
# come only through the gateway, and the gateway reads /activity on the
# health/metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "igloo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $server | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: sql
          protocol: TCP
        {{- if .Values.console.enabled }}
        - port: console
          protocol: TCP
        {{- end }}
        {{- if .Values.flightSQL.enabled }}
        - port: flight-sql
          protocol: TCP
        {{- end }}
        {{- if .Values.iceberg.enabled }}
        - port: iceberg
          protocol: TCP
        {{- end }}
      {{- if .Values.scaleToZero.enabled }}
      from:
        - podSelector:
            matchLabels:
              {{- $gateway | nindent 14 }}
      {{- else }}
      {{- with .Values.networkPolicy.sqlFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
        {{- if $.Values.scaleToZero.enabled }}
        - podSelector:
            matchLabels:
              {{- $gateway | nindent 14 }}
        {{- end }}
      {{- end }}
{{- if .Values.scaleToZero.enabled }}
---
# Scale-to-zero gateway: SQL clients, and its health/metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "igloo.gatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $gateway | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: sql
          protocol: TCP
        {{- if .Values.console.enabled }}
        - port: console
          protocol: TCP
        {{- end }}
        {{- if .Values.flightSQL.enabled }}
        - port: flight-sql
          protocol: TCP
        {{- end }}
        {{- if .Values.iceberg.enabled }}
        - port: iceberg
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.sqlFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.postgresql.enabled }}
---
# Bundled PostgreSQL: igloo (users) and Lakekeeper (catalog) only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "igloo.postgresqlName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "igloo.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $server | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- $catalog | nindent 14 }}
      ports:
        - port: postgresql
          protocol: TCP
{{- end }}
{{- if .Values.objectStorage.enabled }}
---
# Bundled object store: igloo (table data) and Lakekeeper (metadata files),
# and networkPolicy.objectStorageFrom: engines that read and write table
# files with the credentials for one table that the Iceberg REST catalog
# hands them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "igloo.objectStorageName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "object-storage") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "igloo.selectorLabels" (dict "root" . "component" "object-storage") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $server | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- $catalog | nindent 14 }}
      ports:
        - port: s3
          protocol: TCP
    {{- with .Values.networkPolicy.objectStorageFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: s3
          protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
