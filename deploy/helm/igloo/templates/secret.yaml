{{- $data := include "igloo.secretData" . -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "igloo.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "server") | nindent 4 }}
  annotations:
    # Generated passwords and keys outlive `helm uninstall`, like the
    # PostgreSQL volume they unlock and the catalog data the encryption key
    # protects. Reinstalling the release adopts this Secret again.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- $data | nindent 2 }}
{{- end }}
