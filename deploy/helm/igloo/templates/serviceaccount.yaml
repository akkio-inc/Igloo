{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "igloo.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "server") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.workers.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "igloo.workerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "worker") | nindent 4 }}
  {{- with .Values.workers.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.catalog.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "igloo.catalogServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "catalog") | nindent 4 }}
  {{- with .Values.catalog.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.scaleToZero.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "igloo.gatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "gateway") | nindent 4 }}
# The scale-to-zero gateway calls the Kubernetes API (see gateway.yaml).
automountServiceAccountToken: true
{{- end }}
