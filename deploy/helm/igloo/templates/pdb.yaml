{{- /* The scale-to-zero gateway stops pods through the Deployment's scale
subresource, which is not an eviction, so this budget does not hold it back;
at zero replicas it simply has no pods to protect. */ -}}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "igloo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igloo.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "igloo.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
{{- end }}
