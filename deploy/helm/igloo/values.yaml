# Values for the Igloo chart. Environment variables named below are documented
# in docs/configuration.md.
#
# Required: a warehouse location (storage.warehouseLocation, or
# objectStorage.enabled=true) and a PostgreSQL database (metadataDatabase /
# catalog.database, or postgresql.enabled=true). For a self-contained
# development install:
#
#   helm install igloo ./igloo --set postgresql.enabled=true --set objectStorage.enabled=true

image:
  repository: ghcr.io/akkio-inc/igloo
  # Empty uses the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Pull secrets for every image in the chart.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Igloo pods. Each one is a complete query engine; they share the catalog and
# the users database, and keep nothing but spill files locally. Ignored with
# autoscaling.enabled; with scaleToZero.enabled, the number the gateway starts
# unless scaleToZero.replicas is set.
replicaCount: 2

admin:
  # -> IGLOO_ADMIN_USER. Lowercase letters, digits and underscores.
  user: igloo
  # Secret with key "password" -> IGLOO_ADMIN_PASSWORD. Takes precedence over
  # admin.password.
  existingSecret: ""
  # Used when existingSecret is empty. If both are empty the chart generates a
  # password (32 characters) and keeps it across upgrades. Igloo uses it only
  # to create the account on first start, and then refuses passwords under 16
  # characters, placeholders such as change-me and easily guessed ones; change
  # it later with ALTER USER.
  password: ""

erasure:
  # Secret with key "key" -> IGLOO_ERASURE_KEY, which seals the identifiers of
  # erasure requests while they run. Generated and kept across upgrades when
  # empty; requests running when it changes must be made again.
  existingSecret: ""

# PostgreSQL database for Igloo's users (schema "igloo"). Usually the same
# database as the catalog's. When this is empty Igloo uses catalog.database, and
# when both are empty, the bundled PostgreSQL (postgresql.enabled).
metadataDatabase:
  # Secret with key "url" (postgresql://...) -> IGLOO_METADATA_DATABASE_URL.
  existingSecret: ""
  url: ""

storage:
  # Where table data lives -> IGLOO_WAREHOUSE_LOCATION. One of
  #   s3://bucket/warehouse
  #   gs://bucket/warehouse
  #   abfss://filesystem@account.dfs.core.windows.net/warehouse
  # Defaults to s3://<objectStorage.bucket>/warehouse when objectStorage.enabled.
  warehouseLocation: ""
  # Extra URL prefixes users may read and write, e.g. a landing bucket for
  # COPY -> IGLOO_ALLOWED_LOCATIONS.
  allowedLocations: []
  s3:
    # host:port of an S3-compatible store. Empty means AWS -> IGLOO_S3_ENDPOINT.
    endpoint: ""
    region: us-east-1
    # vhost for AWS, path for most self-hosted stores.
    urlStyle: vhost
    useSSL: true
    # Secret with keys "access-key-id" and "secret-access-key". Empty uses the
    # AWS credential chain (IRSA, EKS Pod Identity); then set
    # catalog.systemCredentials=aws.
    existingSecret: ""
    # IAM role Igloo assumes to hand other engines short-lived credentials
    # limited to one table (docs/external-engines.md) -> IGLOO_S3_STS_ROLE_ARN.
    # Empty on AWS: engines get table metadata but no storage credentials.
    # S3-compatible stores need none.
    stsRoleArn: ""
  gcs:
    # Secret with keys "hmac-key-id" and "hmac-secret" -> IGLOO_GCS_HMAC_*.
    # Required for gs:// locations; also set catalog.systemCredentials=gcp.
    existingSecret: ""
  azure:
    # Secret with key "account-key" -> IGLOO_AZURE_ACCOUNT_KEY. Empty uses
    # workload identity; then set catalog.systemCredentials=azure.
    existingSecret: ""

duckdb:
  # -> IGLOO_DUCKDB_MEMORY_LIMIT, e.g. "6GB". Empty: 80% of
  # resources.limits.memory, leaving at least 512Mi for the rest of the
  # process, so queries spill to disk before the container is OOM-killed.
  memoryLimit: ""
  # -> IGLOO_DUCKDB_THREADS. null: two per core of the node (four on workers).
  threads: null
  # -> IGLOO_DUCKDB_MAX_TEMP_SIZE, e.g. "40GiB": the most spill space one pod
  # may use. Empty: 90% of spillVolume.sizeLimit, so a query that needs more
  # fails instead of getting the pod evicted.
  maxTempSize: ""
  spillVolume:
    # emptyDir for DuckDB spill files at /var/lib/igloo/tmp.
    sizeLimit: 50Gi
    # "" (node disk: kubelet's directory, local NVMe on nodes set up for it;
    # see README) or "Memory".
    medium: ""

# kubernetes.io/tls Secret (tls.crt, tls.key) -> IGLOO_TLS_CERT_FILE and
# IGLOO_TLS_KEY_FILE. Igloo reads it at start; restart pods after rotating it.
tls:
  existingSecret: ""

# Cancel statements that run longer, e.g. "30m" (a Go duration) ->
# IGLOO_STATEMENT_TIMEOUT. Empty: no limit. Sessions can change their own
# limit with SET statement_timeout.
statementTimeout: ""
# Concurrent client sessions per igloo pod -> IGLOO_MAX_CONNECTIONS. Further
# logins get "too many clients".
maxConnections: 100
# On shutdown, keep accepting connections this long while reporting not
# ready, so the Service stops routing here first -> IGLOO_SHUTDOWN_DELAY.
# Keep terminationGracePeriodSeconds above this plus 30s of query draining.
shutdownDelay: 5s

# Automatic table maintenance: compaction, snapshot expiry and orphan file
# cleanup. Replicas take turns through a lock in the metadata database.
maintenance:
  # -> IGLOO_MAINTENANCE. Turn off only if another tool maintains the tables.
  enabled: true
  # How long old snapshots, and so time travel, are kept, e.g. "7d" or "36h"
  # -> IGLOO_SNAPSHOT_RETENTION. A table's
  # history.expire.max-snapshot-age-ms property overrides it.
  snapshotRetention: 7d

log:
  # text or json -> IGLOO_LOG_FORMAT
  format: text
  # debug, info, warn or error -> IGLOO_LOG_LEVEL
  level: info

# Extra environment variables (Kubernetes EnvVar objects) appended to the igloo
# container, for any IGLOO_* setting without a dedicated value, e.g.
#   - name: IGLOO_CATALOG_SCHEMA
#     value: analytics
extraEnv: []

serviceAccount:
  create: true
  # Defaults to the release fullname. Workload identity bindings refer to it.
  name: ""
  # e.g. eks.amazonaws.com/role-arn, iam.gke.io/gcp-service-account,
  # azure.workload.identity/client-id
  annotations: {}

# Added to igloo pods, e.g. azure.workload.identity/use: "true".
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
# Empty: prefer spreading igloo pods across nodes.
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests: { cpu: "2", memory: 8Gi }
  limits: { memory: 8Gi }

# Igloo stops accepting queries on SIGTERM and gives running ones 30 seconds.
terminationGracePeriodSeconds: 45
# e.g. {preStop: {sleep: {seconds: 5}}} (Kubernetes 1.30+) so load balancers
# stop sending new connections before the pod shuts down.
lifecycle: {}

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# On first start Igloo waits up to 3 minutes for the database and the catalog,
# then bootstraps the catalog; /healthz answers once it serves SQL.
startupProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60
livenessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
# /readyz checks DuckDB, the users database and the catalog.
readinessProbe:
  httpGet: { path: /readyz, port: http }
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

service:
  # LoadBalancer exposes SQL outside the cluster; turn on TLS first.
  type: ClusterIP
  port: 5432
  annotations: {}
  # Client CIDRs allowed through a LoadBalancer.
  loadBalancerSourceRanges: []
  loadBalancerClass: ""
  # Cluster or Local (LoadBalancer and NodePort only).
  externalTrafficPolicy: ""

# Web console (docs/console.md) on the SQL Service: sign in with Igloo users
# to run SQL, browse data and manage users. Passwords cross the network in
# the sign-in form, so it signs users in only over TLS (tls.existingSecret)
# or when reached as localhost, e.g. through kubectl port-forward.
console:
  enabled: true
  port: 8443

# Iceberg REST catalog (docs/external-engines.md) on the SQL Service: Spark,
# Trino, PyIceberg, Snowflake and Databricks sign in with Igloo users and use
# Igloo's tables under its grants. Without TLS (tls.existingSecret) it serves
# clients on private networks only. With the bundled object store, let the
# engines reach it with networkPolicy.objectStorageFrom.
iceberg:
  enabled: true
  port: 8181
# Arrow Flight SQL (docs/flight-sql.md) on the SQL Service: query results as
# Arrow record batches for ADBC, pyarrow and the Flight SQL JDBC driver.
# Clients sign in with their Igloo password, so it serves them only over TLS
# (tls.existingSecret) or when reached as localhost, e.g. through kubectl
# port-forward.
flightSQL:
  enabled: true
  port: 31337
# Single sign-on to the web console with an OpenID Connect identity provider
# (Okta, Microsoft Entra ID, Google Workspace, Keycloak), and access tokens for
# SQL clients of people who sign in that way; see docs/sso.md. Turn on TLS
# (tls.existingSecret) unless the console is reached only through kubectl
# port-forward.
sso:
  # The provider's issuer URL -> IGLOO_OIDC_ISSUER. Empty turns single
  # sign-on off.
  issuer: ""
  # -> IGLOO_OIDC_CLIENT_ID
  clientId: ""
  # Secret with key "client-secret", mounted as a file ->
  # IGLOO_OIDC_CLIENT_SECRET_FILE. Empty for a public client (PKCE only).
  existingSecret: ""
  # The console's callback as registered at the provider,
  # https://<console host>/sso/callback -> IGLOO_OIDC_REDIRECT_URL. Empty:
  # derived from each request, which works when browsers reach the console
  # under one name.
  redirectUrl: ""
  # -> IGLOO_OIDC_SCOPES. Add "groups" for providers that send groups only
  # when asked (Okta, Dex).
  scopes: [openid, profile, email]
  # Claim that names and recognises users -> IGLOO_OIDC_USERNAME_CLAIM: email
  # (verified), or preferred_username for Microsoft Entra ID.
  usernameClaim: email
  # -> IGLOO_OIDC_GROUPS_CLAIM
  groupsClaim: groups
  # Only these email domains, and members of these groups, may sign in ->
  # IGLOO_OIDC_ALLOWED_DOMAINS, IGLOO_OIDC_ALLOWED_GROUPS. Google Workspace
  # needs allowedDomains.
  allowedDomains: []
  allowedGroups: []
  # Create an Igloo user, with role none, at someone's first sign-in ->
  # IGLOO_OIDC_CREATE_USERS. false: admins create users first.
  createUsers: true
  # Let users linked to the provider still sign in with a password ->
  # IGLOO_OIDC_PASSWORD_SIGNIN.
  passwordSignIn: true
  # Label of the sign-in button -> IGLOO_OIDC_DISPLAY_NAME.
  displayName: SSO
  # Accept the provider's access tokens for this audience as SQL passwords,
  # inside TLS -> IGLOO_OIDC_ACCESS_TOKEN_AUDIENCE. Empty: off.
  accessTokenAudience: ""

# Longest lifetime of an access token (CREATE TOKEN ... EXPIRES) ->
# IGLOO_TOKEN_MAX_LIFETIME.
tokenMaxLifetime: 365d

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Scale to zero (docs/scale-to-zero.md). A small, always-on gateway takes the
# igloo pods' place behind the SQL Service. It scales the igloo Deployment to
# zero after suspendAfter without client traffic or running work, and back up
# when a client connects; that connection waits while the pods start. The
# chart then leaves the Deployment's replica count to the gateway.
scaleToZero:
  enabled: false
  # -> IGLOO_GATEWAY_SUSPEND_AFTER, a Go duration.
  suspendAfter: 10m
  # How long a connecting client waits for igloo to start before the gateway
  # closes its connection -> IGLOO_GATEWAY_RESUME_TIMEOUT. Allow for the
  # cluster autoscaler adding a node.
  resumeTimeout: 5m
  # Igloo pods the gateway starts -> IGLOO_GATEWAY_K8S_REPLICAS. null:
  # replicaCount, or autoscaling.minReplicas with autoscaling.enabled.
  replicas: null
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  # Gateway pod scheduling, separate from igloo's: keep the gateway on an
  # always-on node pool, and igloo (nodeSelector, tolerations, affinity above)
  # on one the cluster autoscaler can shrink to zero.
  nodeSelector: {}
  tolerations: []
  affinity: {}

# What one igloo pod's machine costs an hour, e.g. 0.58, for the cost
# estimates of igloo.usage -> IGLOO_PRICE_PER_HOUR. 0: unknown, and costs
# are NULL.
pricePerHour: 0

# Compute pools ("virtual warehouses", docs/workload-management.md): more
# igloo Deployments that share this release's catalog, metadata database and
# warehouse, each sized, scaled and billed on its own, so a client or team
# gets its own compute. Each pool gets a Deployment and SQL Service named
# <fullname>-pool-<name>, a metrics Service, and, with scaleToZero.enabled,
# its own gateway. Its statements are recorded with its name in
# igloo.query_history and igloo.usage. Every key but name defaults to the
# release's own value; extraEnv adds to it. Pools never run table
# maintenance, and have no HorizontalPodAutoscaler or PodDisruptionBudget.
#   - name: acme              # 1 to 20 lowercase letters, digits, hyphens
#     replicaCount: 1
#     pricePerHour: 1.45
#     resources:
#       requests: { cpu: "8", memory: 32Gi }
#       limits: { memory: 32Gi }
#     duckdb: {}              # memoryLimit, threads, maxTempSize, spillVolume
#     scaleToZero: { enabled: true, suspendAfter: 15m }
#     service: { type: LoadBalancer, loadBalancerSourceRanges: ["203.0.113.0/24"] }
#     nodeSelector: {}
#     tolerations: []
#     affinity: {}
#     workers: {}             # its own workers, with workers.enabled: overrides, or enabled: false
#     extraEnv: []
pools: []

# Distributed execution (docs/distributed-execution.md). Statements that read
# large tables run in parts on worker pods, which igloo starts when a
# statement needs them and stops when they have been idle; the chart leaves
# their number to igloo. Give them their own node pool with a minimum size of
# zero (nodeSelector, tolerations) so idle workers cost nothing.
workers:
  enabled: false
  # The most worker pods igloo starts -> IGLOO_WORKER_MAX.
  maxReplicas: 4
  # Stop workers after this long without tasks -> IGLOO_WORKER_IDLE_AFTER.
  idleAfter: 10m
  # How long a statement waits for workers to start before it runs on one
  # igloo pod instead -> IGLOO_WORKER_START_TIMEOUT. Allow for the cluster
  # autoscaler adding nodes.
  startTimeout: 3m
  # Secret with key "secret" (at least 32 characters) -> IGLOO_WORKER_SECRET,
  # which igloo and workers authenticate each other with. Generated and kept
  # across upgrades when empty.
  existingSecret: ""
  duckdb:
    # As duckdb.* for igloo pods, from workers.resources.
    memoryLimit: ""
    threads: null
    spillVolume:
      sizeLimit: 100Gi
      medium: ""
  # emptyDir for the read cache: data files the worker read, so repeated
  # statements read them from local disk.
  cacheVolume:
    sizeLimit: 50Gi
  resources:
    requests: { cpu: "4", memory: 16Gi }
    limits: { memory: 16Gi }
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  # Empty: prefer one worker per node.
  affinity: {}

# Prometheus metrics are served on port 8080 at /metrics, through the
# <fullname>-metrics ClusterIP Service (never through the SQL Service), and the
# scale-to-zero gateway's through <fullname>-gateway-metrics.
metrics:
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    scrapeTimeout: ""
    labels: {}

# Ingress rules only; egress is not restricted (pods need DNS, PostgreSQL,
# object storage and cloud identity endpoints). Lakekeeper accepts connections
# only from igloo pods, the bundled PostgreSQL and object store only from igloo
# and Lakekeeper pods (and the store from objectStorageFrom).
networkPolicy:
  enabled: true
  # NetworkPolicy peers allowed to reach the SQL, console and Iceberg REST
  # ports. Empty: everyone (the Service type and loadBalancerSourceRanges
  # decide who that is).
  sqlFrom: []
  # Peers allowed to reach the metrics/health port 8080. Empty: everyone.
  metricsFrom: []
  # Peers besides igloo and Lakekeeper allowed to reach the bundled object
  # store: engines in the cluster, such as Spark or Trino pods, that read and
  # write table files with the credentials for one table that the Iceberg
  # REST catalog hands them. Empty: none.
  objectStorageFrom: []

# Bundled Lakekeeper (Iceberg REST catalog). Always deployed by this chart. It
# runs without authentication, so it is only reachable inside the cluster.
catalog:
  image:
    repository: quay.io/lakekeeper/catalog
    tag: v0.14.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Warehouse name in the catalog -> IGLOO_CATALOG_WAREHOUSE.
  warehouse: igloo
  # Defaults to metadataDatabase when empty, then to the bundled PostgreSQL.
  database:
    # Secret with key "url" -> LAKEKEEPER__PG_DATABASE_URL_READ/WRITE.
    existingSecret: ""
    url: ""
  encryptionKey:
    # Secret with key "encryption-key" -> LAKEKEEPER__PG_ENCRYPTION_KEY.
    # Generated and kept across upgrades when empty. It must never change once
    # the catalog stores credentials.
    existingSecret: ""
  # none | aws | gcp | azure: let Lakekeeper use its own cloud identity for
  # storage (LAKEKEEPER__ENABLE_*_SYSTEM_CREDENTIALS).
  systemCredentials: none
  serviceAccount:
    create: true
    # Defaults to <fullname>-catalog.
    name: ""
    annotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { memory: 512Mi }

# Bundled PostgreSQL, for development and on-prem only. Cloud modules use
# managed PostgreSQL.
postgresql:
  enabled: false
  image: postgres:17
  persistence:
    size: 10Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { memory: 1Gi }

# Bundled S3-compatible store (RustFS), for development and on-prem only.
objectStorage:
  enabled: false
  image: rustfs/rustfs:1.0.1
  bucket: igloo
  persistence:
    size: 50Gi
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
  # Creates the bucket from an init container of each igloo pod.
  initImage: curlimages/curl:8.16.0

# `helm test` connects through the SQL Service with psql.
tests:
  image: postgres:17
