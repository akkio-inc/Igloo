# Igloo on one machine: a Postgres-compatible SQL endpoint and web console,
# an Iceberg catalog, and (optionally) a local object store for table data.
# Settings come from .env; run ./init-env.sh to create one.

name: igloo

x-database-url: &database-url postgresql://lakekeeper:${CATALOG_DB_PASSWORD:?run ./init-env.sh to create .env}@postgres:5432/lakekeeper

x-catalog-env: &catalog-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${CATALOG_ENCRYPTION_KEY:?}
  LAKEKEEPER__PG_DATABASE_URL_READ: *database-url
  LAKEKEEPER__PG_DATABASE_URL_WRITE: *database-url
  # Lets the catalog use its machine identity (e.g. an EC2 instance role)
  # when no S3 keys are configured.
  LAKEKEEPER__ENABLE_AWS_SYSTEM_CREDENTIALS: "true"
  LAKEKEEPER__S3_ENABLE_DIRECT_SYSTEM_CREDENTIALS: "true"

services:
  # The SQL endpoint and web console. Connect with any Postgres client or
  # Arrow Flight SQL client, or open http://127.0.0.1:8443 in a browser.
  igloo:
    # `make up` builds from this checkout. To run a released image instead,
    # set IGLOO_IMAGE in .env and start with `docker compose up -d --no-build`.
    build:
      context: ../..
    image: ${IGLOO_IMAGE:-igloo:dev}
    restart: unless-stopped
    environment:
      IGLOO_ADMIN_USER: ${IGLOO_ADMIN_USER:-igloo}
      IGLOO_ADMIN_PASSWORD: ${IGLOO_ADMIN_PASSWORD:?}
      # Users live in the same Postgres database as the catalog (schema "igloo").
      IGLOO_METADATA_DATABASE_URL: *database-url
      IGLOO_CATALOG_URI: http://lakekeeper:8181/catalog
      IGLOO_CATALOG_WAREHOUSE: ${WAREHOUSE:-igloo}
      IGLOO_WAREHOUSE_LOCATION: s3://${S3_BUCKET:?}/warehouse
      IGLOO_ALLOWED_LOCATIONS: ${IGLOO_ALLOWED_LOCATIONS:-}
      IGLOO_DUCKDB_MEMORY_LIMIT: ${IGLOO_MEMORY_LIMIT:-}
      # Empty sizes the read cache from the free disk space; 0 turns it off.
      IGLOO_CACHE_SIZE: ${IGLOO_CACHE_SIZE:-}
      IGLOO_S3_ENDPOINT: ${S3_ENDPOINT:-}
      IGLOO_S3_REGION: ${S3_REGION:?}
      IGLOO_S3_URL_STYLE: ${S3_URL_STYLE:?}
      IGLOO_S3_USE_SSL: ${S3_USE_SSL:?}
      IGLOO_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      IGLOO_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      IGLOO_S3_STS_ROLE_ARN: ${S3_STS_ROLE_ARN:-}
      IGLOO_TLS_CERT_FILE: ${IGLOO_TLS_CERT_FILE:-}
      IGLOO_TLS_KEY_FILE: ${IGLOO_TLS_KEY_FILE:-}
      IGLOO_LOG_FORMAT: ${IGLOO_LOG_FORMAT:-text}
      IGLOO_SNAPSHOT_RETENTION: ${IGLOO_SNAPSHOT_RETENTION:-7d}
      IGLOO_MAINTENANCE_INTERVAL: ${IGLOO_MAINTENANCE_INTERVAL:-1h}
      # Single sign-on to the console and access tokens (docs/sso.md). An
      # empty issuer turns single sign-on off.
      IGLOO_OIDC_ISSUER: ${IGLOO_OIDC_ISSUER:-}
      IGLOO_OIDC_CLIENT_ID: ${IGLOO_OIDC_CLIENT_ID:-}
      IGLOO_OIDC_CLIENT_SECRET: ${IGLOO_OIDC_CLIENT_SECRET:-}
      IGLOO_OIDC_REDIRECT_URL: ${IGLOO_OIDC_REDIRECT_URL:-}
      IGLOO_OIDC_SCOPES: ${IGLOO_OIDC_SCOPES:-openid profile email}
      IGLOO_OIDC_USERNAME_CLAIM: ${IGLOO_OIDC_USERNAME_CLAIM:-email}
      IGLOO_OIDC_GROUPS_CLAIM: ${IGLOO_OIDC_GROUPS_CLAIM:-groups}
      IGLOO_OIDC_ALLOWED_DOMAINS: ${IGLOO_OIDC_ALLOWED_DOMAINS:-}
      IGLOO_OIDC_ALLOWED_GROUPS: ${IGLOO_OIDC_ALLOWED_GROUPS:-}
      IGLOO_OIDC_CREATE_USERS: ${IGLOO_OIDC_CREATE_USERS:-true}
      IGLOO_OIDC_PASSWORD_SIGNIN: ${IGLOO_OIDC_PASSWORD_SIGNIN:-true}
      IGLOO_OIDC_DISPLAY_NAME: ${IGLOO_OIDC_DISPLAY_NAME:-SSO}
      IGLOO_OIDC_ACCESS_TOKEN_AUDIENCE: ${IGLOO_OIDC_ACCESS_TOKEN_AUDIENCE:-}
      IGLOO_TOKEN_MAX_LIFETIME: ${IGLOO_TOKEN_MAX_LIFETIME:-365d}
      # The compute pool, and what this machine costs an hour, for the
      # cost estimates of igloo.usage (docs/workload-management.md).
      IGLOO_POOL: ${IGLOO_POOL:-default}
      IGLOO_PRICE_PER_HOUR: ${IGLOO_PRICE_PER_HOUR:-0}
      IGLOO_SHARING_URL: ${IGLOO_SHARING_URL:-}
      # Alerts and notifications (docs/alerts.md): private hosts they may
      # reach, and the mail server for email alerts.
      IGLOO_NOTIFICATION_ALLOW_HOSTS: ${IGLOO_NOTIFICATION_ALLOW_HOSTS:-}
      IGLOO_SMTP_HOST: ${IGLOO_SMTP_HOST:-}
      IGLOO_SMTP_PORT: ${IGLOO_SMTP_PORT:-}
      IGLOO_SMTP_FROM: ${IGLOO_SMTP_FROM:-}
      IGLOO_SMTP_ALLOWED_DOMAINS: ${IGLOO_SMTP_ALLOWED_DOMAINS:-}
      IGLOO_SMTP_USERNAME: ${IGLOO_SMTP_USERNAME:-}
      IGLOO_SMTP_PASSWORD: ${IGLOO_SMTP_PASSWORD:-}
      # Lineage events for OpenLineage tools (docs/catalog.md#openlineage).
      # An empty URL sends none.
      IGLOO_OPENLINEAGE_URL: ${IGLOO_OPENLINEAGE_URL:-}
      IGLOO_OPENLINEAGE_API_KEY: ${IGLOO_OPENLINEAGE_API_KEY:-}
      IGLOO_OPENLINEAGE_NAMESPACE: ${IGLOO_OPENLINEAGE_NAMESPACE:-igloo}
      IGLOO_OPENLINEAGE_SEND_SQL: ${IGLOO_OPENLINEAGE_SEND_SQL:-false}
      IGLOO_OPENLINEAGE_ALLOW_PRIVATE: ${IGLOO_OPENLINEAGE_ALLOW_PRIVATE:-false}
      # Distributed execution (docs/distributed-execution.md): with
      # IGLOO_WORKERS=worker and the "workers" profile, statements that read
      # large tables run in parts on the worker containers.
      IGLOO_WORKERS: ${IGLOO_WORKERS:-}
      IGLOO_WORKER_SECRET: ${IGLOO_WORKER_SECRET:-}
    ports:
      # Loopback only by default. Set IGLOO_BIND=0.0.0.0 to accept remote
      # clients, and turn on TLS first (see .env).
      - "${IGLOO_BIND:-127.0.0.1}:${IGLOO_PORT:-5433}:5432"
      # Health checks, Prometheus metrics and /activity. Loopback only by
      # default; a scale-to-zero gateway on another machine needs it on the
      # private network (IGLOO_HTTP_BIND, docs/scale-to-zero.md).
      - "${IGLOO_HTTP_BIND:-127.0.0.1}:${IGLOO_HTTP_PORT:-8432}:8080"
      # The web console. Loopback only by default; without TLS it accepts
      # sign-ins only from a browser at localhost (docs/console.md).
      - "${IGLOO_CONSOLE_BIND:-127.0.0.1}:${IGLOO_CONSOLE_PORT:-8443}:8443"
      # Arrow Flight SQL. Loopback only by default; without TLS it serves
      # only clients that connect as localhost (docs/flight-sql.md).
      - "${IGLOO_FLIGHT_BIND:-127.0.0.1}:${IGLOO_FLIGHT_PORT:-31337}:31337"
      # The Iceberg REST catalog for Spark, Trino and other engines
      # (docs/external-engines.md). Loopback only by default; without TLS it
      # serves clients on private networks only.
      - "${IGLOO_ICEBERG_BIND:-127.0.0.1}:${IGLOO_ICEBERG_PORT:-8181}:8181"
      # The Delta Sharing endpoint for recipients of shares. Loopback only
      # by default; without TLS it answers only requests to localhost
      # (docs/sharing.md).
      - "${IGLOO_SHARING_BIND:-127.0.0.1}:${IGLOO_SHARING_PORT:-8444}:8444"
    volumes:
      - igloo-spill:/var/lib/igloo/tmp
      # Copies of table files read from object storage, kept across
      # restarts (docs/operations.md#read-cache).
      - igloo-cache:/var/lib/igloo/cache
      - ./tls:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
        required: false

  # Distributed-execution workers, enabled by adding "workers" to
  # COMPOSE_PROFILES and setting IGLOO_WORKERS=worker in .env. Each runs
  # parts of statements for igloo on its own DuckDB; on one machine they
  # share its cores, so this is for trying distributed execution out and
  # testing it. Their task port (7433) is not published on the host: only
  # containers of this stack reach it, and it serves only holders of
  # IGLOO_WORKER_SECRET, over TLS keyed by it.
  worker:
    build:
      context: ../..
    image: ${IGLOO_IMAGE:-igloo:dev}
    profiles: ["workers"]
    restart: unless-stopped
    command: ["worker"]
    deploy:
      replicas: ${IGLOO_WORKER_REPLICAS:-2}
    environment:
      IGLOO_WORKER_SECRET: ${IGLOO_WORKER_SECRET:-}
      IGLOO_WAREHOUSE_LOCATION: s3://${S3_BUCKET:?}/warehouse
      IGLOO_ALLOWED_LOCATIONS: ${IGLOO_ALLOWED_LOCATIONS:-}
      IGLOO_DUCKDB_MEMORY_LIMIT: ${IGLOO_WORKER_MEMORY_LIMIT:-}
      IGLOO_DUCKDB_THREADS: ${IGLOO_WORKER_THREADS:-}
      IGLOO_CACHE_SIZE: ${IGLOO_CACHE_SIZE:-}
      IGLOO_S3_ENDPOINT: ${S3_ENDPOINT:-}
      IGLOO_S3_REGION: ${S3_REGION:?}
      IGLOO_S3_URL_STYLE: ${S3_URL_STYLE:?}
      IGLOO_S3_USE_SSL: ${S3_USE_SSL:?}
      IGLOO_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      IGLOO_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      IGLOO_LOG_FORMAT: ${IGLOO_LOG_FORMAT:-text}
    depends_on:
      create-bucket:
        condition: service_completed_successfully
        required: false

  # Iceberg REST catalog: tracks tables, schemas and snapshots. Only igloo
  # can reach it; it is not published on the host. Other engines use the
  # catalog through Igloo's port 8181 instead.
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.14.0
    restart: unless-stopped
    command: ["serve"]
    environment: *catalog-env
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 10s
      retries: 30
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully

  catalog-migrate:
    image: quay.io/lakekeeper/catalog:v0.14.0
    command: ["migrate"]
    environment: *catalog-env
    depends_on:
      postgres:
        condition: service_healthy

  # Catalog metadata and Igloo users. Table data lives in object storage.
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
      POSTGRES_DB: lakekeeper
    volumes:
      - catalog-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Local S3-compatible object store, for machines without cloud storage.
  # Enabled by COMPOSE_PROFILES=local-storage in .env.
  storage:
    image: rustfs/rustfs:1.0.1
    profiles: ["local-storage"]
    restart: unless-stopped
    # Not ${VAR:?}: Compose checks every service, even ones whose profile is
    # off, and with Amazon S3 and an IAM role these keys are empty.
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  create-bucket:
    image: curlimages/curl:8.22.0
    profiles: ["local-storage"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        url="http://storage:9000/$$S3_BUCKET"
        auth="--aws-sigv4 aws:amz:$$S3_REGION:s3 --user $$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY"
        if curl -fs -o /dev/null -I $$auth "$$url"; then
          echo "bucket $$S3_BUCKET exists"
        else
          curl -fsS -X PUT $$auth "$$url" && echo "created bucket $$S3_BUCKET"
        fi
    environment:
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      storage:
        condition: service_healthy

  # psql client for people without one installed:
  #   docker compose run --rm psql
  psql:
    image: postgres:17
    profiles: ["tools"]
    entrypoint: ["psql"]
    environment:
      PGHOST: igloo
      PGPORT: "5432"
      PGUSER: ${IGLOO_ADMIN_USER:-igloo}
      PGPASSWORD: ${IGLOO_ADMIN_PASSWORD}
      PGDATABASE: igloo
    volumes:
      - ./sql:/sql:ro
    depends_on:
      igloo:
        condition: service_healthy

volumes:
  igloo-spill:
  igloo-cache:
  catalog-db:
  storage-data:
