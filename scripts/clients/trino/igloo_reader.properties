# The same catalog as igloo.properties, as the Igloo user in
# READER_CREDENTIAL.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:ICEBERG_URI}
iceberg.rest-catalog.warehouse=igloo
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:READER_CREDENTIAL}
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
